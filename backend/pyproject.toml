# Project metadata for tooling. Nothing here is packaged or installed: the
# service runs from this directory (see Dockerfile), so the only consumer is
# pytest, which reads [tool.pytest.ini_options] below.

[project]
name = "aisen-backend"
version = "0.3.0"
description = "Semantic search over Universitas Diponegoro eprints"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Modules are imported as top-level names from this directory, so that it is
# what the test run puts on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
