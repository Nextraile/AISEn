name: aisen

services:
  aisen-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Match the host UID so the bind-mounted data directory is writable by
        # the container. Run these from backend/:
        # Run from `backend/` and always pass `--env-file .env`: `-f docker/...`
        # makes `docker/` the project directory, so Compose would otherwise look
        # for `docker/.env` when interpolating ${APP_UID} / ${API_PORT} /
        # ${HEALTH_START_PERIOD} and silently fall back to the defaults.
        # Linux/WSL: APP_UID=$(id -u) docker compose -f docker/docker-compose.yml --env-file .env up
        # PowerShell: $env:APP_UID=1000; docker compose -f docker/docker-compose.yml --env-file .env up

        APP_UID: ${APP_UID:-10001}
    image: aisen-api:latest
    container_name: aisen-api
    env_file: ../.env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # The whole data directory: ChromaDB needs write access, and `/ready`
      # reads `last_ingest.json` written next to `documents.json` by the CLI.
      # Docker creates this as root if it is missing, which the container (UID
      # APP_UID) then cannot write. `docker-entrypoint.sh` detects that and says
      # so; create the directory as your own user before the first `up`.
      - ../data:/app/data
      - model_cache:/model-cache
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      # first model load can take ~70 seconds, and longer if EMBEDDING_MODEL is changed to a larger model.
      # Set HEALTH_START_PERIOD in `backend/.env`; it only takes effect because
      # the documented command passes `--env-file .env` (see the header above).
      start_period: ${HEALTH_START_PERIOD:-120s}

  # Ingestion CLI: the same image with the ingestion package (INGEST=1), so the
  # cached torch layer is reused instead of downloaded again. The whole backend
  # directory is mounted because the script writes ./data/documents.json as well
  # as ./data/vector_db.
  #
  #   docker compose -f docker/docker-compose.yml --env-file .env --profile tools run --rm tools --all
  #   docker compose -f docker/docker-compose.yml --env-file .env --profile tools run --rm tools --query "..."
  tools:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        INGEST: "1"
    env_file: ../.env
    volumes:
      # The whole backend directory, so harvest output and the DB land on the
      # host. `--query` therefore needs no extra mount.
      - ..:/app
      - model_cache:/model-cache
    # `python -m ingestion.ingest ...` instead of uvicorn; the writability guard is
    # for the server, and here the mount is meant to be written.
    entrypoint: ["python", "-m", "ingestion.ingest"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Polls /ready and logs only state changes, so a silent outage shows up even
  # when nobody is watching the API logs. Set ALERT_WEBHOOK_URL in .env to also
  # receive a message on Discord or any generic webhook.
  watch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        # The serving image omits ingestion/; service/watch.py is stdlib-only, so
        # this reuses the same image rather than adding a dependency.
        INGEST: "0"
    env_file: ../.env
    environment:
      WATCH_URL: http://aisen-api:8000/ready
    # `python -m service.watch` instead of uvicorn; interval/timeout come from .env
    entrypoint: ["python", "-m", "service.watch"]
    depends_on:
      - aisen-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model_cache:
