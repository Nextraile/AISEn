# Overlay that gives the `tools` service the GPU:
#
#   CUDA_TAG=cu126 APP_UID=$(id -u) docker compose \
#     -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml \
#     --env-file .env --profile tools run --rm tools --index
#
# The main file stays free of `gpus: all` on purpose: Docker refuses to create
# such a container on a host without the NVIDIA container runtime, and `tools`
# is also how the tests run on a CPU-only machine.

services:
  tools:
    build:
      args:
        # Defaults to the CUDA 12.6 index here, since asking for this file at
        # all means the image should be able to use the card.
        CUDA_TAG: ${CUDA_TAG:-cu126}
    gpus: all
    environment:
      # The image now carries CUDA torch, so demand CUDA: a card this build
      # cannot see fails at load time instead of encoding on the CPU.
      EMBED_DEVICE: cuda
