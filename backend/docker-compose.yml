name: aisen

services:
  aisen-api:
    build:
      context: .
      args:
        # Match the host UID so the bind-mounted ./data/vector_db is writable by the container
        # Linux/WSL: APP_UID=$(id -u) docker compose up
        # PowerShell: $env:APP_UID=1000; docker compose up

        APP_UID: ${APP_UID:-10001}
    container_name: aisen-api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # The whole data directory: ChromaDB needs write access, and `/ready`
      # reads `last_ingest.json` written next to `documents.json` by the CLI.
      - ./data:/app/data
      - model_cache:/model-cache
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      # first model load can take ~70 seconds, and longer if EMBEDDING_MODEL is changed to a larger model.
      start_period: ${HEALTH_START_PERIOD:-120s}

  # Ingestion CLI: the same image with ingest.py included (INGEST=1), so the
  # cached torch layer is reused instead of downloaded again. The whole backend
  # directory is mounted because the script writes ./data/documents.json as well
  # as ./data/vector_db.
  #
  #   docker compose --profile tools run --rm tools ingest.py --all
  #   docker compose --profile tools run --rm tools ingest.py --query "..."
  tools:
    profiles: ["tools"]
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        INGEST: "1"
    env_file: .env
    volumes:
      # The whole backend directory, so harvest output and the DB land on the
      # host. `ingest.py --query` therefore needs no extra mount.
      - .:/app
      - model_cache:/model-cache
    # `python ingest.py ...` instead of uvicorn; the file-writability guard is
    # for the server, and here the mount is meant to be written.
    entrypoint: ["python"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Polls /ready and logs only state changes, so a silent outage shows up even
  # when nobody is watching the API logs. Set ALERT_WEBHOOK_URL in .env to also
  # receive a message on Discord or any generic webhook.
  watch:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        # The serving image omits ingest.py; watch.py is a stdlib script, so
        # this reuses the same image rather than adding a dependency.
        INGEST: "0"
    env_file: .env
    environment:
      WATCH_URL: http://aisen-api:8000/ready
    # `python watch.py` instead of uvicorn; interval and timeout come from .env
    entrypoint: ["python", "watch.py"]
    depends_on:
      - aisen-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model_cache:
