name: aisen

services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
        VITE_DEFAULT_THRESHOLD: ${VITE_DEFAULT_THRESHOLD:-0.60}
        VITE_RESULTS_PER_PAGE: ${VITE_RESULTS_PER_PAGE:-10}
        VITE_SEARCH_DEBOUNCE_MS: ${VITE_SEARCH_DEBOUNCE_MS:-350}
        VITE_RELEVANCE_LOW: ${VITE_RELEVANCE_LOW:-0.4}
        VITE_RELEVANCE_MEDIUM: ${VITE_RELEVANCE_MEDIUM:-0.5}
        VITE_RELEVANCE_HIGH: ${VITE_RELEVANCE_HIGH:-0.6}
    image: aisen-web:latest
    container_name: aisen-web
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://aisen-api:8000}
    ports:
      - "${WEB_PORT:-3000}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
